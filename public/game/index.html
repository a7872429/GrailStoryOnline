<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19140f"><title>傳說紀行</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="skills.css"></head><body>
<div id="start" class="overlay"><div class="panel intro"><p class="eyebrow">雙人同機 · 原型版</p><h1>傳說紀行</h1><p>運用角色與命運，率先完成四次紀行。</p><label>玩家一<input id="name1" value="玩家一" maxlength="12"></label><label>玩家二<input id="name2" value="玩家二" maxlength="12"></label><button id="newGame" class="primary">展開紀行</button><small>雙方各自選擇一張起始角色；個別牌效請依卡面手動執行。</small></div></div>
<div id="pass" class="overlay hidden"><div class="panel"><p>請把畫面交給</p><h2 id="passName"></h2><button id="reveal" class="primary">我準備好了</button></div></div>
<main id="game" class="game hidden"><header><div><span class="eyebrow">LEGEND CHRONICLE</span><h1>傳說紀行</h1></div><div class="turn"><span>現在回合</span><strong id="turnName"></strong></div><button id="restart" class="ghost">重新開局</button></header>
<section class="table-center"><aside class="event-panel"><div class="title"><span>當前事件</span><b id="eventDeckCount"></b></div><div id="currentEvent" class="card-row current-event-row"></div><div class="title"><span>事件準備區（購買後翻開）</span></div><div id="eventReady" class="card-row events"></div></aside><div class="market-panel"><div class="title"><span>中央區</span><b id="deckCount"></b></div><div id="center" class="card-row market"></div><div class="piles"><div id="deckPile" class="visual-pile"></div><div id="discardPile" class="visual-pile"></div></div></div><aside id="opponent" class="opponent-compact"></aside></section>
<section id="activePlayer" class="player-band"></section><nav id="actions" class="actions"></nav><div id="hint" class="hint">點選手牌可選擇直接入場或發動進場效果。</div><details class="log-wrap"><summary>紀行紀錄</summary><ol id="log"></ol></details></main>
<div id="choice" class="overlay hidden"><div class="panel choice-panel"><h2 id="choiceTitle"></h2><p id="choiceText"></p><div id="choiceCards" class="choice-cards"></div><div class="choice-actions"><button id="choiceCancel" class="ghost">取消</button><button id="choiceConfirm" class="primary">確認選擇</button></div></div></div>
<div id="cardPreview" class="card-preview hidden"><button id="previewClose" class="preview-close" type="button" aria-label="關閉角色詳細技能">×</button><img id="previewImage" alt="卡牌放大圖"><div><strong id="previewTitle"></strong><div id="previewText" class="skill-text"></div></div></div>
<div id="modal" class="overlay hidden"><div class="panel"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="modalClose" class="primary">確定</button></div></div><script src="card-data.js?v=33"></script><script src="app.js?v=33"></script><script src="network.js?v=33"></script></body></html>
